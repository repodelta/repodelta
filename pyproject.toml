[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "repodelta"
version = "0.1.0"
description = "Requirement-first, evidence-linked pull request review briefs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/repodelta/repodelta"
Issues = "https://github.com/repodelta/repodelta/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repodelta = "repodelta.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
