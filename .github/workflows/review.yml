name: RepoDelta review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository in owner/name form
        required: true
        default: repodelta/repodelta
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      REVIEW_REPOSITORY: ${{ inputs.repository || github.repository }}
      REVIEW_PR: ${{ inputs.pull_request || github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.REPODELTA_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Generate requirement-first report
        run: repodelta review --repo "$REVIEW_REPOSITORY" --pr "$REVIEW_PR" --output "build/pr-$REVIEW_PR.html"
      - name: Upload review report
        id: report
        uses: actions/upload-artifact@v4
        with:
          name: repodelta-review-${{ env.REVIEW_PR }}
          path: build/pr-${{ env.REVIEW_PR }}.html
          if-no-files-found: error
          retention-days: 14
      - name: Publish report link
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo "## RepoDelta review"
            echo
            echo "Target: [$REVIEW_REPOSITORY#$REVIEW_PR](https://github.com/$REVIEW_REPOSITORY/pull/$REVIEW_PR)"
            echo
            echo "[Download the HTML review report]($ARTIFACT_URL)"
            echo
            echo "The artifact is retained for 14 days and follows repository access permissions."
          } >> "$GITHUB_STEP_SUMMARY"
