name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: repodelta review --fixture fixtures/pr574.json --output build/pr574.html
      - name: Run offline evaluation baseline
        run: |
          repodelta evaluate \
            --suite fixtures/evaluation-suite.json \
            --json-output build/evaluation.json \
            --markdown-output build/evaluation.md
      - uses: actions/upload-artifact@v6
        with:
          name: review-brief
          path: build/pr574.html
      - uses: actions/upload-artifact@v6
        with:
          name: evaluation-baseline
          path: |
            build/evaluation.json
            build/evaluation.md
