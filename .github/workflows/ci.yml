name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: prismcode review --fixture fixtures/pr574.json --output build/pr574.html
      - uses: actions/upload-artifact@v4
        with:
          name: review-brief
          path: build/pr574.html
